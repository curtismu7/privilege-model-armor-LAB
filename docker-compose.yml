# OrbStack:  HOST_PORT=7846 docker compose up --build -d   ->  http://127.0.0.1:7846
# The server binds 0.0.0.0 INSIDE the container (PMA_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. 7846 is PROVISIONAL (not claimed on the board yet); HOST_PORT stays in 7800-7999.
name: privilege-model-armor-lab

services:
  privilege-model-armor-lab:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-7846}:7846"
    environment:
      PORT: "7846"
      PMA_BIND: 0.0.0.0
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-local.ping-devops.com,privilege-model-armor-lab.local.ping-devops.com}
    read_only: true
    # Optional branding and vocabulary (rule 12). The root file system is read-only, so the file is a read-only bind mount: copy customer.config.example.json to
    # customer.config.json beside this file, edit it, then uncomment the next two lines. (Left commented on purpose: a bind mount of a missing file makes Docker
    # create a directory in its place.)
    # volumes:
    #   - ./customer.config.json:/app/customer.config.json:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7846/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
